name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # npm trusted publishing (OIDC, no stored token) needs npm 11.5.1 or later;
      # Node 20 ships npm 10. Each package lists this repo and release.yml as a
      # trusted publisher on npmjs.com.
      - run: npm install -g npm@11.20.0

      - run: npm ci

      - run: npm run build -w @razohq/razo -w @razohq/razo-analyzer

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          publish: npx changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
